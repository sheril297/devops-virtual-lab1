name: DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML validator
        run: python -m pip install PyYAML

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          for path in sorted(Path("k8s").glob("*.yml")):
              with path.open() as file:
                  documents = list(yaml.safe_load_all(file))
              if not documents or any(doc is None for doc in documents):
                  raise ValueError(f"Empty YAML document: {path}")
              print(f"Validated: {path}")
          PY

      - name: Build Docker image
        run: docker build -t devops-lab-app:latest ./app
